<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>사무실 출입 관리 대시보드</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .photo-card { border: 1px solid #ddd; padding: 5px; border-radius: 6px; background: #fff; }
    .photo-card img { width: 100%; height: 110px; object-fit: cover; border-radius: 4px; }
    .time-label { font-size: 11px; color: #666; margin-top: 4px; text-align: center; }
  </style>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>🏢 사무실 출입 관리 대시보드</h1>
  
  <div class="card">
    <h3>오늘의 총 출입 기록</h3>
    <p id="total-count" style="font-size: 36px; font-weight: bold; color: #2b56f5;">0회</p>
  </div>

  <div class="card">
    <h3>실시간 사진 및 감지 로그</h3>
    <div id="gallery" class="photo-grid"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co";
    const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadLogs() {
      const { data, error } = await _supabase
        .from('visitor_logs')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        return;
      }

      const gallery = document.getElementById('gallery');
      document.getElementById('total-count').innerText = data.length + '회';
      gallery.innerHTML = '';

      data.forEach(item => {
        const date = new Date(item.created_at).toLocaleString('ko-KR');
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `
          <img src="${item.image_url}" alt="방문 사진">
          <div class="time-label">${date}</div>
        `;
        gallery.appendChild(card);
      });
    }

    // 5초마다 데이터 최신화
    loadLogs();
    setInterval(loadLogs, 5000);
  </script>
</body>
</html>
